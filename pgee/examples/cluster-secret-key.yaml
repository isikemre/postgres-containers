# PGEE cluster whose data encryption key (DEK) comes from a Kubernetes Secret.
# Simplest setup, no external key service. Every instance mounts the same
# Secret, so primary, replicas and restores all use the same key.
#
# Create the key once and keep a copy OUTSIDE the cluster (key escrow): losing
# it makes the database and every backup unreadable. The DEK cannot be rotated.
#   kubectl create secret generic pgee-tde-key --from-literal=key="$(openssl rand -hex 32)"
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pgee-secret
spec:
  instances: 3
  imageName: registry.example.com/db/postgresql-ee:17-minimal-trixie

  # TDE is switched on by the initdb wrapper in the image: no
  # bootstrap.initdb.options needed, so dataChecksums & co. keep working.
  bootstrap:
    initdb:
      dataChecksums: true

  env:
    - name: TDE_KEY_SOURCE
      value: file
    - name: TDE_KEY_FILE
      value: /projected/pgee-tde/key
    - name: TDE_KEY_BITS   # never change it after the bootstrap
      value: "256"

  # Mounted under /projected in every instance and job pod.
  projectedVolumeTemplate:
    defaultMode: 0440
    sources:
      - secret:
          name: pgee-tde-key
          items:
            - key: key
              path: pgee-tde/key

  storage:
    size: 10Gi
